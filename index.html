<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MathUniverse — complete school mathematics from Class 1 to 12: chapter notes, a searchable formula library, a step-by-step math solver and unlimited practice. English + বাংলা."
    />
    <meta name="theme-color" content="#10233c" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MathUniverse — From Class 1 to 12" />
    <meta
      property="og:description"
      content="Chapter notes, a searchable formula library, an offline step-by-step solver and unlimited practice — in English and বাংলা."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MathUniverse — From Class 1 to 12" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310233c'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23e8b64c' font-family='Georgia,serif'%3E%CE%A3%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>MathUniverse — From Class 1 to 12</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('mu.theme');
        if (!saved) {
          saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 34rem; margin: 12vh auto; padding: 0 1.5rem; font-family: Georgia, serif; color: #16233a">
        <h1 style="font-size: 1.6rem">MathUniverse</h1>
        <p style="line-height: 1.6; color: #5c6b81">
          This app needs JavaScript to run. Please enable it in your browser, or open the site in a
          modern browser such as Chrome, Firefox, Safari or Edge.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
